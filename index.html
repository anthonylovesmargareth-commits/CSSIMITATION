<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS3 Image Imitation Assignment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS3 Image Effects</h1>
    <p>Six image projects created with HTML and CSS3.</p>
  </header>

  <main class="gallery">
    <section class="project">
      <h2>1. Penguin Oval</h2>
      <div class="penguin-frame">
        <img src="penguins.jpg" alt="A group of penguins">
      </div>
    </section>

    <section class="project">
      <h2>2. Football Field</h2>
      <div class="field-frame">
        <img class="field" src="football_field.jpg" alt="A football field">
        <img class="board" src="tic-tac-toe.png" alt="Tic-tac-toe board">
      </div>
    </section>

    <section class="project">
      <h2>3. Dinosaur Shadow</h2>
      <div class="dinosaur-frame">
        <img src="dinosaur.png" alt="A cartoon dinosaur">
      </div>
    </section>

    <section class="project">
      <h2>4. Seagull with Gradient</h2>
      <div class="seagull-frame">
        <img src="seagull.png" alt="A seagull flying">
      </div>
    </section>

    <section class="project">
      <h2>5. Butterfly Shape</h2>
      <div class="butterfly-frame">
        <img src="butterfly.jpg" alt="A monarch butterfly">
      </div>
    </section>

    <section class="project">
      <h2>6. Theater Presentation</h2>
      <div class="theater-frame">
        <img src="theater_stage.jpg" alt="A theater stage">
        <span>Presenting</span>
      </div>
    </section>
  </main>
  <footer>Created with HTML and CSS3.</footer>
</body>
</html>
